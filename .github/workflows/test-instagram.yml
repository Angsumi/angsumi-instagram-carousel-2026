name: Publish 7:15 PM Instagram test post

on:
  schedule:
    # 19:15 IST on 8 October 2026 is 13:45 UTC. Later slots are retries.
    - cron: "45,50 13 * * *"
    - cron: "10 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: angsumi-instagram-test
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish test post if due
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.COMPOSIO_INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$INSTAGRAM_ACCESS_TOKEN" ]; then
            RUN_MODE=test python scripts/publish_graph.py
          else
            python scripts/publish_test.py
          fi
